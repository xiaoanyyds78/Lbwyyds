<!DOCTYPE html>
<!--
  作者：柳博文-24002120602
  建立时间：2026-11-18
  使用大模型：DeepSeek-V4.1-Flash
  功能名称：移动端图片查看器（双指缩放、单指拖动、双击 1x/2x 切换）
-->
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="移动端图片查看器：双指缩放、拖动、双击放大">
    <title>图片查看器 · 双指缩放</title>
    <style>
        :root {
            --lbw_bg: #0b0d10;
            --lbw_ink: #fffdf8;
            --lbw_muted: rgba(255, 253, 248, .6);
            --lbw_line: rgba(255, 253, 248, .14);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--lbw_ink);
            background: var(--lbw_bg);
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            line-height: 1.6;
        }

        .lbw_app {
            width: min(100%, 520px);
            margin: 0 auto;
            padding: 18px 16px 40px;
        }

        .lbw_head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }

        .lbw_title {
            margin: 0;
            font-size: 20px;
            letter-spacing: .04em;
        }

        .lbw_scale {
            color: var(--lbw_muted);
            font-size: 13px;
            font-variant-numeric: tabular-nums;
        }

        /* 图片容器：裁掉溢出部分，手势全部交给脚本处理，禁止选中 */
        .lbw_viewer {
            position: relative;
            height: 62vh;
            min-height: 320px;
            display: grid;
            place-items: center;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            background: #05070a;
            border: 1px solid var(--lbw_line);
            border-radius: 16px;
        }

        /* 绝对定位 + 四边 0 + margin:auto：按容器尺寸等比缩到框内，
           max-width/height 的百分比能正常生效（放在 grid 里会失效，图片会被裁掉） */
        .lbw_image {
            position: absolute;
            inset: 0;
            margin: auto;
            display: block;
            max-width: 100%;
            max-height: 100%;
            transform-origin: center center;
            transition: transform .25s ease;
            will-change: transform;
            pointer-events: none;
        }

        .lbw_tips {
            margin-top: 16px;
            padding: 14px 16px;
            border: 1px dashed var(--lbw_line);
            border-radius: 12px;
            color: var(--lbw_muted);
            font-size: 13px;
            line-height: 1.9;
        }

        .lbw_tips strong {
            display: block;
            margin-bottom: 2px;
            color: var(--lbw_ink);
        }

        /* 打开页面时的提示条 */
        .lbw_toast {
            position: fixed;
            left: 50%;
            top: 18px;
            transform: translateX(-50%);
            padding: 10px 18px;
            border-radius: 999px;
            background: rgba(255, 253, 248, .94);
            color: #101418;
            font-size: 13px;
            white-space: nowrap;
            box-shadow: 0 10px 24px rgba(0, 0, 0, .4);
            opacity: 1;
            transition: opacity .4s ease;
            pointer-events: none;
        }

        .lbw_toast.lbw_hide {
            opacity: 0;
        }
    </style>
</head>

<body>
    <p class="lbw_toast" id="lbw_toast" role="status">双指缩放请用手机打开</p>

    <div class="lbw_app">
        <div class="lbw_head">
            <h1 class="lbw_title">图片查看器</h1>
            <span class="lbw_scale" id="lbw_scale">1.0x</span>
        </div>

        <!-- 手势区：overflow: hidden / touch-action: none / user-select: none -->
        <div class="lbw_viewer" id="lbw_viewer">
            <img class="lbw_image" id="lbw_image" src="images/lbw_zoom_garden.jpg" alt="江南园林一角：亭台、红灯笼与锦鲤池" draggable="false">
        </div>

        <div class="lbw_tips">
            <strong>操作说明</strong>
            双指捏合缩放（1～4 倍），以两指中点为基准；超出 1～4 倍时有阻尼，松手自动弹回；放大后单指拖动画面，松手回到边界内，1x 时拖不动；双击在 1x 与 2x 之间切换；旋转屏幕后缩放状态保留。
        </div>
    </div>

    <script>
        // 缩放范围
        var lbw_minScale = 1;
        var lbw_maxScale = 4;
        // 超出范围时的阻尼系数：继续拉只会按 1/4 的比例变化，松手后弹回
        var lbw_damping = 0.25;
        // 双击切换的目标倍数
        var lbw_doubleTapScale = 2;
        // 双击判定间隔（ms）与允许的手指抖动（px）
        var lbw_tapGap = 300;
        var lbw_tapSlop = 10;

        // 当前缩放倍数与位移
        var lbw_scale = 1;
        var lbw_x = 0;
        var lbw_y = 0;

        // 手势开始时的基准值
        var lbw_startScale = 1;
        var lbw_startX = 0;
        var lbw_startY = 0;
        var lbw_startDistance = 0;
        var lbw_startPointerX = 0;
        var lbw_startPointerY = 0;

        // 手势状态："none" 空闲、"drag" 单指拖动、"pinch" 双指缩放
        var lbw_mode = "none";
        // 上一次轻点的时间与按下位置，用于判断双击
        var lbw_lastTapTime = 0;
        var lbw_tapDownX = 0;
        var lbw_tapDownY = 0;

        var lbw_container = document.getElementById("lbw_viewer");
        var lbw_image = document.getElementById("lbw_image");
        var lbw_scaleLabel = document.getElementById("lbw_scale");

        /**
         * 计算两个触点之间的距离，用于按比例缩放
         * @param {Touch} lbw_a 触点 A
         * @param {Touch} lbw_b 触点 B
         * @returns {number} 两点直线距离（px）
         */
        function lbw_getDistance(lbw_a, lbw_b) {
            var lbw_dx = lbw_b.clientX - lbw_a.clientX;
            var lbw_dy = lbw_b.clientY - lbw_a.clientY;
            return Math.sqrt(lbw_dx * lbw_dx + lbw_dy * lbw_dy);
        }

        /**
         * 取两个触点的中点，作为缩放基准
         * @param {Touch} lbw_a 触点 A
         * @param {Touch} lbw_b 触点 B
         * @returns {{x: number, y: number}} 中点坐标
         */
        function lbw_getMidpoint(lbw_a, lbw_b) {
            return {
                x: (lbw_a.clientX + lbw_b.clientX) / 2,
                y: (lbw_a.clientY + lbw_b.clientY) / 2
            };
        }

        /**
         * 把位移限制在图片放大后的边界内
         * @param {number} lbw_rawX 期望的横向位移
         * @param {number} lbw_rawY 期望的纵向位移
         * @param {number} lbw_nowScale 当前缩放倍数
         * @returns {{x: number, y: number}} 限制后的位移
         */
        function lbw_clamp(lbw_rawX, lbw_rawY, lbw_nowScale) {
            // 图片放大 (scale-1) 倍后，四周各多出的可移动范围
            var lbw_maxX = (lbw_image.offsetWidth * (lbw_nowScale - 1)) / 2;
            var lbw_maxY = (lbw_image.offsetHeight * (lbw_nowScale - 1)) / 2;
            return {
                x: Math.min(lbw_maxX, Math.max(-lbw_maxX, lbw_rawX)),
                y: Math.min(lbw_maxY, Math.max(-lbw_maxY, lbw_rawY))
            };
        }

        /**
         * 把因阻尼超出 1～4 倍的倍数收回到范围内，位移按同比例缩放
         */
        function lbw_settleScale() {
            var lbw_settled = Math.min(lbw_maxScale, Math.max(lbw_minScale, lbw_scale));
            if (lbw_settled === lbw_scale) {
                return;
            }
            lbw_x = (lbw_x * lbw_settled) / lbw_scale;
            lbw_y = (lbw_y * lbw_settled) / lbw_scale;
            lbw_scale = lbw_settled;
        }

        /**
         * 把当前的缩放与位移写到图片样式上，并同步倍数标签
         * @param {boolean} lbw_useTransition 是否带 0.25s 过渡（拖动过程中传 false）
         */
        function lbw_render(lbw_useTransition) {
            lbw_image.style.transition = lbw_useTransition ? "transform .25s ease" : "none";
            lbw_image.style.transform = "translate(" + lbw_x + "px, " + lbw_y + "px) scale(" + lbw_scale + ")";
            lbw_scaleLabel.textContent = lbw_scale.toFixed(1) + "x";
        }

        /**
         * 以某个屏幕点为基准缩放到目标倍数，保证该点下的画面位置不动
         * @param {number} lbw_targetScale 目标倍数
         * @param {number} lbw_anchorX 基准点横坐标（视口坐标）
         * @param {number} lbw_anchorY 基准点纵坐标（视口坐标）
         * @param {number} lbw_baseScale 缩放前的倍数
         * @param {number} lbw_baseX 缩放前的横向位移
         * @param {number} lbw_baseY 缩放前的纵向位移
         */
        function lbw_zoomTo(lbw_targetScale, lbw_anchorX, lbw_anchorY, lbw_baseScale, lbw_baseX, lbw_baseY) {
            var lbw_rect = lbw_container.getBoundingClientRect();
            // 基准点相对容器中心的偏移
            var lbw_ax = lbw_anchorX - (lbw_rect.left + lbw_rect.width / 2);
            var lbw_ay = lbw_anchorY - (lbw_rect.top + lbw_rect.height / 2);

            lbw_scale = lbw_targetScale;
            // 反推位移：让基准点下的内容缩放前后落在同一位置
            lbw_x = lbw_ax - (lbw_scale * (lbw_ax - lbw_baseX)) / lbw_baseScale;
            lbw_y = lbw_ay - (lbw_scale * (lbw_ay - lbw_baseY)) / lbw_baseScale;

            var lbw_clamped = lbw_clamp(lbw_x, lbw_y, lbw_scale);
            lbw_x = lbw_clamped.x;
            lbw_y = lbw_clamped.y;
        }

        /**
         * 手指按下：区分单指 / 双指，记录初始距离与基准位移
         * @param {TouchEvent} lbw_event 触摸事件
         */
        function lbw_onTouchStart(lbw_event) {
            // 先按当前尺寸收一次边：旋转屏幕后即使没收到 resize 事件，第一次触摸也能归位
            lbw_onResize();
            if (lbw_event.touches.length >= 2) {
                // 双指：进入缩放状态，记下两指初始距离与当前基准
                lbw_mode = "pinch";
                lbw_startDistance = lbw_getDistance(lbw_event.touches[0], lbw_event.touches[1]);
                lbw_startScale = lbw_scale;
                lbw_startX = lbw_x;
                lbw_startY = lbw_y;
                lbw_lastTapTime = 0;
                return;
            }

            if (lbw_event.touches.length === 1) {
                // 单指：进入拖动状态，记下起点
                lbw_mode = "drag";
                lbw_startPointerX = lbw_event.touches[0].clientX;
                lbw_startPointerY = lbw_event.touches[0].clientY;
                lbw_startX = lbw_x;
                lbw_startY = lbw_y;
                lbw_tapDownX = lbw_startPointerX;
                lbw_tapDownY = lbw_startPointerY;
            }
        }

        /**
         * 手指移动：双指按距离比例缩放，单指且已放大时拖动画面
         * @param {TouchEvent} lbw_event 触摸事件
         */
        function lbw_onTouchMove(lbw_event) {
            // 双指缩放：新距离 / 初始距离 = 缩放倍数
            if (lbw_mode === "pinch" && lbw_event.touches.length >= 2) {
                lbw_event.preventDefault();

                var lbw_distance = lbw_getDistance(lbw_event.touches[0], lbw_event.touches[1]);
                if (lbw_startDistance === 0) {
                    return;
                }

                var lbw_ratio = lbw_distance / lbw_startDistance;
                var lbw_target = lbw_startScale * lbw_ratio;
                // 1～4 倍之内正常跟手；超出范围时加阻尼，只按 25% 的比例继续变大或变小
                if (lbw_target > lbw_maxScale) {
                    lbw_target = lbw_maxScale + (lbw_target - lbw_maxScale) * lbw_damping;
                }
                if (lbw_target < lbw_minScale) {
                    lbw_target = lbw_minScale - (lbw_minScale - lbw_target) * lbw_damping;
                }

                var lbw_mid = lbw_getMidpoint(lbw_event.touches[0], lbw_event.touches[1]);
                lbw_zoomTo(lbw_target, lbw_mid.x, lbw_mid.y, lbw_startScale, lbw_startX, lbw_startY);
                lbw_render(false);
                return;
            }

            // 单指拖动：只有放大后才允许移动画面
            if (lbw_mode === "drag" && lbw_event.touches.length === 1 && lbw_scale > 1) {
                lbw_event.preventDefault();

                var lbw_moveX = lbw_startX + (lbw_event.touches[0].clientX - lbw_startPointerX);
                var lbw_moveY = lbw_startY + (lbw_event.touches[0].clientY - lbw_startPointerY);
                var lbw_limited = lbw_clamp(lbw_moveX, lbw_moveY, lbw_scale);

                lbw_x = lbw_limited.x;
                lbw_y = lbw_limited.y;
                lbw_render(false);
            }
        }

        /**
         * 手指抬起：处理双击切换，并把位移收回边界内
         * @param {TouchEvent} lbw_event 触摸事件
         */
        function lbw_onTouchEnd(lbw_event) {
            // 双指时抬起一根，还剩一根就转成单指拖动
            if (lbw_mode === "pinch") {
                if (lbw_event.touches.length === 1) {
                    lbw_mode = "drag";
                    lbw_startPointerX = lbw_event.touches[0].clientX;
                    lbw_startPointerY = lbw_event.touches[0].clientY;
                    lbw_startX = lbw_x;
                    lbw_startY = lbw_y;
                    return;
                }
                // 两指都抬起：倍数收回到 1～4、位移收边，结束手势
                lbw_settleScale();
                var lbw_pinchClamped = lbw_clamp(lbw_x, lbw_y, lbw_scale);
                lbw_x = lbw_pinchClamped.x;
                lbw_y = lbw_pinchClamped.y;
                lbw_render(true);
                lbw_mode = "none";
                return;
            }

            if (lbw_mode !== "drag") {
                return;
            }

            // 判断是不是一次轻点（位移很小）
            var lbw_endX = lbw_event.changedTouches[0].clientX;
            var lbw_endY = lbw_event.changedTouches[0].clientY;
            var lbw_isTap = Math.abs(lbw_endX - lbw_tapDownX) < lbw_tapSlop &&
                Math.abs(lbw_endY - lbw_tapDownY) < lbw_tapSlop;

            if (lbw_isTap) {
                var lbw_now = Date.now();
                if (lbw_now - lbw_lastTapTime < lbw_tapGap) {
                    // 300ms 内第二次轻点 = 双击：在 1x 与 2x 之间切换，以点击位置为基准
                    if (lbw_scale > 1) {
                        lbw_scale = 1;
                        lbw_x = 0;
                        lbw_y = 0;
                    } else {
                        lbw_zoomTo(lbw_doubleTapScale, lbw_endX, lbw_endY, 1, 0, 0);
                    }
                    lbw_render(true);
                    lbw_lastTapTime = 0;
                } else {
                    lbw_lastTapTime = lbw_now;
                }
            }

            // 松手后把倍数收回范围、位移限制回边界内，带 0.25s 过渡
            lbw_settleScale();
            var lbw_clamped = lbw_clamp(lbw_x, lbw_y, lbw_scale);
            lbw_x = lbw_clamped.x;
            lbw_y = lbw_clamped.y;
            lbw_render(true);
            lbw_mode = "none";
        }

        /**
         * 容器尺寸变化（旋转屏幕、窗口缩放）时，按新尺寸收边，缩放倍数保持不变
         */
        function lbw_onResize() {
            lbw_settleScale();
            var lbw_clamped = lbw_clamp(lbw_x, lbw_y, lbw_scale);
            lbw_x = lbw_clamped.x;
            lbw_y = lbw_clamped.y;
            lbw_render(false);
        }

        /**
         * 初始化：绑定手势事件、显示开场提示
         */
        function lbw_init() {
            lbw_container.addEventListener("touchstart", lbw_onTouchStart, { passive: false });
            lbw_container.addEventListener("touchmove", lbw_onTouchMove, { passive: false });
            lbw_container.addEventListener("touchend", lbw_onTouchEnd, { passive: false });
            lbw_container.addEventListener("touchcancel", lbw_onTouchEnd, { passive: false });
            // 旋转屏幕 / 窗口缩放：ResizeObserver 在布局完成后触发，能读到图片的新尺寸
            if (typeof ResizeObserver === "function") {
                var lbw_resizeObserver = new ResizeObserver(lbw_onResize);
                lbw_resizeObserver.observe(lbw_container);
            }
            window.addEventListener("resize", lbw_onResize);
            window.addEventListener("orientationchange", lbw_onResize);
            // 双击时不要选中图片或弹出系统菜单
            lbw_container.addEventListener("contextmenu", function (lbw_event) {
                lbw_event.preventDefault();
            });

            lbw_render(false);

            // 开场提示：3 秒后淡出
            var lbw_toast = document.getElementById("lbw_toast");
            setTimeout(function () {
                lbw_toast.classList.add("lbw_hide");
            }, 3000);
        }

        lbw_init();
    </script>
</body>

</html>
