<!DOCTYPE html>
<!--
  作者：柳博文
  建立时间：2026-11-06
  使用大模型：DeepSeek-V4.1-Flash
  功能名称：大国重器光影展 · 3D 立方体无缝轮播
  说明：立方体旋转切换 4 张展品、3.2 秒自动翻页、手动操作不中断、圆点分页器可点击
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大国重器光影展 · 立方体轮播</title>
<style>
  :root {
    --lbw_bg: #06070a;
    --lbw_bg-soft: #0d1017;
    --lbw_ink: #ece6d8;
    --lbw_ink-dim: #9a9384;
    --lbw_gold: #d9b46a;
    --lbw_gold-deep: #a9823c;
    --lbw_line: rgba(217, 180, 106, .22);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(217, 180, 106, .12), transparent 60%),
      radial-gradient(900px 500px at 100% 100%, rgba(60, 90, 140, .12), transparent 60%),
      var(--lbw_bg);
    color: var(--lbw_ink);
    font-family: "Songti SC", "STSong", "Noto Serif SC", "Microsoft YaHei", serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 56px 20px 64px;
    overflow-x: hidden;
  }

  /* ---------- 页头 ---------- */
  .lbw_head {
    width: min(1080px, 92vw);
    margin-bottom: 34px;
    text-align: center;
  }

  .lbw_eyebrow {
    font-family: "Segoe UI", system-ui, sans-serif;
    font-size: 11px;
    letter-spacing: .42em;
    text-transform: uppercase;
    color: var(--lbw_gold);
    opacity: .85;
    margin-bottom: 18px;
  }

  .lbw_title {
    font-size: clamp(30px, 5.2vw, 58px);
    font-weight: 700;
    letter-spacing: .14em;
    line-height: 1.15;
    background: linear-gradient(180deg, #fff8e6 10%, var(--lbw_gold) 78%, var(--lbw_gold-deep));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .lbw_rule {
    width: 72px;
    height: 1px;
    margin: 20px auto 18px;
    background: linear-gradient(90deg, transparent, var(--lbw_gold), transparent);
  }

  .lbw_desc {
    font-size: 14px;
    line-height: 1.9;
    color: var(--lbw_ink-dim);
    letter-spacing: .06em;
  }

  /* ---------- 轮播 ---------- */
  .lbw_carousel {
    position: relative;
    width: min(1080px, 92vw);
    --lbw_half: 0px;
  }

  .lbw_viewport {
    position: relative;
    aspect-ratio: 16 / 9;
    perspective: 1500px;
    perspective-origin: 50% 48%;
    border: 1px solid var(--lbw_line);
    box-shadow:
      0 40px 90px rgba(0, 0, 0, .65),
      inset 0 0 0 1px rgba(255, 255, 255, .03);
    background: var(--lbw_bg-soft);
  }

  .lbw_cube {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
    transition: transform .95s cubic-bezier(.62, .02, .2, 1);
    transform: translateZ(calc(var(--lbw_half) * -1)) rotateY(0deg);
  }

  .lbw_cube-face {
    position: absolute;
    inset: 0;
    overflow: hidden;
    background: var(--lbw_bg-soft);
  }

  .lbw_face-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transform: scale(1.04);
    filter: saturate(1.05) contrast(1.08) brightness(.92);
  }

  .lbw_face-shade {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg, rgba(6, 7, 10, .55) 0%, transparent 34%, transparent 46%, rgba(6, 7, 10, .9) 100%),
      linear-gradient(90deg, rgba(6, 7, 10, .55), transparent 55%);
  }

  .lbw_face-frame {
    position: absolute;
    inset: 18px;
    border: 1px solid rgba(217, 180, 106, .28);
    pointer-events: none;
  }

  .lbw_caption {
    position: absolute;
    left: clamp(24px, 5%, 62px);
    bottom: clamp(22px, 5%, 56px);
    right: auto;
    max-width: 76%;
  }

  .lbw_no {
    font-family: "Segoe UI", system-ui, sans-serif;
    font-size: 12px;
    letter-spacing: .3em;
    color: var(--lbw_gold);
    margin-bottom: 14px;
  }

  .lbw_caption-title {
    font-size: clamp(22px, 3.4vw, 42px);
    font-weight: 700;
    letter-spacing: .1em;
    color: #fff8e9;
    text-shadow: 0 6px 24px rgba(0, 0, 0, .75);
    margin-bottom: 10px;
  }

  .lbw_caption-sub {
    font-size: clamp(12px, 1.3vw, 14px);
    letter-spacing: .12em;
    color: var(--lbw_ink-dim);
    padding-left: 14px;
    border-left: 2px solid var(--lbw_gold-deep);
    line-height: 1.7;
    max-width: 420px;
  }

  /* 左右箭头 */
  .lbw_arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 46px;
    height: 46px;
    display: grid;
    place-items: center;
    font-size: 18px;
    color: var(--lbw_gold);
    background: rgba(8, 10, 14, .55);
    border: 1px solid var(--lbw_line);
    border-radius: 50%;
    cursor: pointer;
    z-index: 5;
    transition: background .25s, color .25s, border-color .25s, transform .25s;
    backdrop-filter: blur(4px);
  }

  .lbw_arrow:hover,
  .lbw_arrow:focus-visible {
    background: var(--lbw_gold);
    color: #0a0a0a;
    border-color: var(--lbw_gold);
    outline: none;
  }

  .lbw_arrow-prev { left: -23px; }
  .lbw_arrow-next { right: -23px; }

  /* 圆点分页器 */
  .lbw_dots {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 26px;
  }

  .lbw_dot {
    width: 9px;
    height: 9px;
    padding: 0;
    border: 1px solid rgba(217, 180, 106, .5);
    border-radius: 999px;
    background: transparent;
    cursor: pointer;
    transition: width .3s, background .3s, border-color .3s;
  }

  .lbw_dot:hover { border-color: var(--lbw_gold); background: rgba(217, 180, 106, .35); }

  .lbw_dot.lbw_is-active {
    width: 30px;
    background: var(--lbw_gold);
    border-color: var(--lbw_gold);
  }

  .lbw_hint {
    margin-top: 16px;
    text-align: center;
    font-family: "Segoe UI", system-ui, sans-serif;
    font-size: 11px;
    letter-spacing: .22em;
    color: rgba(154, 147, 132, .75);
  }

  @media (max-width: 720px) {
    .lbw_arrow { width: 38px; height: 38px; font-size: 15px; }
    .lbw_arrow-prev { left: 6px; }
    .lbw_arrow-next { right: 6px; }
    .lbw_face-frame { inset: 10px; }
  }
</style>
</head>
<body>

<header class="lbw_head">
  <p class="lbw_eyebrow">Made in China · Heavy Equipment</p>
  <h1 class="lbw_title">大国重器光影展</h1>
  <div class="lbw_rule" aria-hidden="true"></div>
  <p class="lbw_desc">四件国之重器，四面向度 · 立方体旋转呈现</p>
</header>

<main class="lbw_carousel" data-lbw-carousel data-lbw-interval="3200" aria-roledescription="carousel" aria-label="大国重器光影展">

  <div class="lbw_viewport">
    <div class="lbw_cube">

      <!-- 面 1：歼-20 -->
      <figure class="lbw_cube-face">
        <img class="lbw_face-img" alt="歼-20 隐身战斗机在黄昏跑道起飞"
             src="https://trae-api-cn.mchost.guru/api/ide/v1/tool_text_to_image?prompt=Chinese%20J-20%20stealth%20fighter%20jet%20taking%20off%20on%20runway%20at%20dusk%2C%20golden%20rim%20light%2C%20cinematic%20military%20photography%2C%20dark%20sky&image_size=landscape_16_9">
        <div class="lbw_face-shade" aria-hidden="true"></div>
        <div class="lbw_face-frame" aria-hidden="true"></div>
        <figcaption class="lbw_caption">
          <div class="lbw_no">01 / AIR</div>
          <h2 class="lbw_caption-title">歼-20 威龙</h2>
          <p class="lbw_caption-sub">中国自主研制的第五代隐身战斗机，2011 年首飞，标志着航空工业跨入隐身时代。</p>
        </figcaption>
      </figure>

      <!-- 面 2：复兴号 -->
      <figure class="lbw_cube-face">
        <img class="lbw_face-img" alt="复兴号高速动车组夜间疾驰"
             src="https://trae-api-cn.mchost.guru/api/ide/v1/tool_text_to_image?prompt=CR400%20Fuxing%20high-speed%20train%20speeding%20through%20night%20city%2C%20long%20exposure%20light%20trails%2C%20cinematic%20photography&image_size=landscape_16_9">
        <div class="lbw_face-shade" aria-hidden="true"></div>
        <div class="lbw_face-frame" aria-hidden="true"></div>
        <figcaption class="lbw_caption">
          <div class="lbw_no">02 / RAIL</div>
          <h2 class="lbw_caption-title">复兴号动车组</h2>
          <p class="lbw_caption-sub">CR400 系列中国标准动车组，运营时速 350 公里，实现牵引、制动、网络完全自主。</p>
        </figcaption>
      </figure>

      <!-- 面 3：中国天眼 -->
      <figure class="lbw_cube-face">
        <img class="lbw_face-img" alt="中国天眼 FAST 射电望远镜夜空全景"
             src="https://trae-api-cn.mchost.guru/api/ide/v1/tool_text_to_image?prompt=FAST%20500-meter%20radio%20telescope%20dish%20in%20mountain%20valley%20under%20starry%20night%2C%20aerial%20view%2C%20cinematic%20photography&image_size=landscape_16_9">
        <div class="lbw_face-shade" aria-hidden="true"></div>
        <div class="lbw_face-frame" aria-hidden="true"></div>
        <figcaption class="lbw_caption">
          <div class="lbw_no">03 / SKY</div>
          <h2 class="lbw_caption-title">中国天眼 FAST</h2>
          <p class="lbw_caption-sub">500 米口径球面射电望远镜，落成于贵州喀斯特洼地，是目前世界最大单口径射电望远镜。</p>
        </figcaption>
      </figure>

      <!-- 面 4：蛟龙号 -->
      <figure class="lbw_cube-face">
        <img class="lbw_face-img" alt="蛟龙号载人深潜器在深海探照"
             src="https://trae-api-cn.mchost.guru/api/ide/v1/tool_text_to_image?prompt=Deep%20sea%20manned%20submersible%20with%20bright%20spotlights%20exploring%20dark%20ocean%2C%20blue%20glow%2C%20cinematic%20underwater%20photography&image_size=landscape_16_9">
        <div class="lbw_face-shade" aria-hidden="true"></div>
        <div class="lbw_face-frame" aria-hidden="true"></div>
        <figcaption class="lbw_caption">
          <div class="lbw_no">04 / DEEP</div>
          <h2 class="lbw_caption-title">蛟龙号深潜器</h2>
          <p class="lbw_caption-sub">中国首台自主设计、集成研制的载人深潜器，最大下潜深度 7062 米。</p>
        </figcaption>
      </figure>

    </div>
  </div>

  <button type="button" class="lbw_arrow lbw_arrow-prev" aria-label="上一张">‹</button>
  <button type="button" class="lbw_arrow lbw_arrow-next" aria-label="下一张">›</button>

  <div class="lbw_dots" role="tablist" aria-label="轮播分页"></div>
  <p class="lbw_hint">3.2S AUTO PLAY · 手动操作后自动继续</p>

</main>

<!-- 3D 立方体轮播组件 -->
<script src="js/lbw-carousel.js"></script>
</body>
</html>
