<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抓小球游戏/函数的三个方法的应用</title>
    <style>
    body{
        background-color: white;
        overflow: hidden;
        font-size: 24px;
    }
    #info{
        color: white;
        font-size: 24px;
        margin-bottom: 20px;
    }
    .ball{
        width: 50px;
        height: 50px;
        background-color: red;
        border-radius: 50%;
        position: absolute;
    }
</style>
</head>
<body>
    <div id="info">当前分数：<span id="score">0</span></div>
    <div class="ball" id="ball"></div>

    <script>
        //const是常量指的是变量的引用地址不能变，不是对象里面的数据不能改。
        const game = {
            score: 0, 
            ballDom:document.getElementById('ball'),
            width: 50
            height:50
        };//需要什么函数；小球移动、小球点击、空白点击、空白点击、更新分数
        funnction moveBall(){
            //保证小球在屏幕内
            const maxX =window.innerWidth - game.width;
            const maxY =window.innerHeight - game.height;
            //小球随机位置是0-窗口宽度取整
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);
            //移动小球
            game.ballDom.style.left = randomX + 'px';
            game.ballDom.style.top = randomY + 'px';
        }
        //更新分数
        //普通的函数存在函数提升：函数体在后面，函数的调用在前面，有this、arguments
        //arguments:类数组对象，函数在调用时候传递过来的实参数字对象
        function updateScore(){
            //a=arguments[0]
            //b=arguments[1]
            document.getElementById('score').innerHTML = game.score;
        }
        game.ballDom.addEventListener('click', function(){
            game.score+= 10;
            updateScore();//函数调用
            moveBall();
            //防止冒泡，避免触发body的miss扣分
            e,stopPropagation();
        });
    </script>
</body>
</html>
